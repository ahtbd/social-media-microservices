services:

  # ========= DATABASES =========
  postgres-user:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-network

  postgres-post:
    image: postgres:16-alpine
    container_name: posts-db
    environment:
      POSTGRES_DB: posts_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - posts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d posts_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-network

  mongo-comment:
    image: mongo:7
    container_name: comments-db
    environment:
      MONGO_INITDB_DATABASE: comments_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - comments-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-network

  postgres-like:
    image: postgres:16-alpine
    container_name: likes-db
    environment:
      POSTGRES_DB: likes_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - likes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d likes_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social-network

  # ========= SERVICES =========
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      postgres-user:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/users_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - social-network

  post-service:
    build: ./post-service
    container_name: post-service
    ports:
      - "8082:8082"
    depends_on:
      postgres-post:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-post:5432/posts_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - social-network

  comment-service:
    build: ./comment-service
    container_name: comment-service
    ports:
      - "8083:8083"
    depends_on:
      mongo-comment:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://admin:admin123@mongo-comment:27017/comments_db?authSource=admin
    networks:
      - social-network

  like-service:
    build: ./like-service
    container_name: like-service
    ports:
      - "8084:8084"
    depends_on:
      postgres-like:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-like:5432/likes_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - social-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - post-service
      - comment-service
      - like-service
    networks:
      - social-network

volumes:
  users-data:
  posts-data:
  comments-data:
  likes-data:

networks:
  social-network:
    driver: bridge