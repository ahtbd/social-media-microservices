spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: post-service
          uri: http://post-service:8082
          predicates:
            - Path=/api/posts/**
        - id: comment-service
          uri: http://comment-service:8083
          predicates:
            - Path=/api/comments/**
        - id: like-service
          uri: http://like-service:8084
          predicates:
            - Path=/api/likes/**